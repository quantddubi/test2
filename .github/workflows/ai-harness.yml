name: AI harness

on:
  pull_request:
    paths:
      - '**/AGENTS.md'
      - '**/CLAUDE.md'
      - '**/PROJECT_CONTEXT.md'
      - '.harness/**'
      - 'docs/ai-harness/**'
      - 'docs/tasks/**'
      - '.github/workflows/ai-harness.yml'
      - '**/package.json'
      - '**/pyproject.toml'
  push:
    paths:
      - '**/AGENTS.md'
      - '**/CLAUDE.md'
      - '**/PROJECT_CONTEXT.md'
      - '.harness/**'
      - 'docs/ai-harness/**'
      - 'docs/tasks/**'
      - '.github/workflows/ai-harness.yml'
      - '**/package.json'
      - '**/pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check shared instructions and references
        run: python .harness/run.py check
      - name: Test portable harness
        run: python .harness/test_runner.py
