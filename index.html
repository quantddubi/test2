<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>퀀트 연구 서재</title>
  <meta name="description" content="퀀트 투자·시스템트레이딩·자산배분 논문을 초보자도 이해할 수 있게 정리한 지식 라이브러리. 서가, 지식 그래프, 연구 아이디어 보드." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./assets/styles.css" />
</head>
<body>
  <header class="masthead">
    <div class="wrap">
      <div class="mast-row">
        <h1>퀀트 연구 서재</h1>
        <span class="sub">논문을 읽기 쉽게 풀어 정리한 개인 지식 라이브러리</span>
        <span class="spacer"></span>
        <span class="count-badge" id="countBadge">—</span>
        <button class="icon-btn" id="themeBtn" title="라이트/다크 전환" aria-label="테마 전환">◐</button>
      </div>
      <nav class="tabs" role="tablist" aria-label="보기 선택">
        <button class="tab" role="tab" id="tab-shelf" aria-selected="true" data-view="shelf">📚 서가</button>
        <button class="tab" role="tab" id="tab-graph" aria-selected="false" data-view="graph">🕸 지식 그래프</button>
        <button class="tab" role="tab" id="tab-ideas" aria-selected="false" data-view="ideas">💡 연구 아이디어</button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <div class="controls" id="controls">
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="searchBox" type="search" placeholder="제목·저자·내용 검색" aria-label="논문 검색" />
      </div>
      <div class="chips" id="topicChips" role="group" aria-label="주제 필터"></div>
      <div class="chips" id="diffChips" role="group" aria-label="난이도 필터"></div>
    </div>

    <section id="view-shelf" role="tabpanel" aria-labelledby="tab-shelf"></section>

    <section id="view-graph" role="tabpanel" aria-labelledby="tab-graph" hidden>
      <div class="graph-card">
        <canvas id="graphCanvas" aria-label="논문 관계 그래프. 노드를 클릭하면 해당 노트가 열립니다."></canvas>
        <div class="graph-legend" id="graphLegend">
          <span class="item"><span class="leg-line"></span> 토대로 발전 (builds-on)</span>
          <span class="item"><span class="leg-line extends"></span> 확장 (extends)</span>
          <span class="item"><span class="leg-line contradicts"></span> 반박·충돌 (contradicts)</span>
          <span class="item"><span class="leg-line related"></span> 관련 (related)</span>
          <span class="graph-hint">노드 클릭 = 노트 열기 · 드래그 = 이동</span>
        </div>
      </div>
    </section>

    <section id="view-ideas" role="tabpanel" aria-labelledby="tab-ideas" hidden></section>

    <footer>
      <span>논문 원문 PDF는 저작권 보호를 위해 게시하지 않습니다 — 이 서재는 요약·해석(2차 창작)만 담습니다.</span>
      <span>노트는 Obsidian 호환 마크다운(<code>library/notes/</code>)으로 관리됩니다.</span>
    </footer>
  </main>

  <div class="overlay" id="noteOverlay" hidden>
    <article class="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
      <div class="panel-head">
        <div class="row1">
          <div style="flex:1">
            <h2 id="panelTitle">—</h2>
            <div class="en" id="panelEn"></div>
          </div>
          <button class="icon-btn" id="panelClose" title="닫기 (Esc)" aria-label="닫기">✕</button>
        </div>
        <div class="meta-row" id="panelMeta"></div>
      </div>
      <div class="panel-rel" id="panelRel" hidden></div>
      <div class="panel-body"><div class="note-html" id="panelBody">불러오는 중…</div></div>
    </article>
  </div>

  <div class="tt" id="tooltip" role="status"></div>
  <script src="./assets/app.js" defer></script>
</body>
</html>
